# Publish to PyPI and GitHub Releases when a v* tag is pushed.
#
# Trusted Publishing (OIDC) — no API token stored.
# PyPI is configured to trust this workflow via:
#   https://pypi.org/manage/project/darwin-agentic-cloud/settings/publishing/
#
# To release:
#   git tag -a v0.X.Y -m "..."
#   git push --tags

name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # for GitHub Release creation
  id-token: write   # for PyPI Trusted Publishing OIDC

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.9.5"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build sdist and wheel
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/darwin-agentic-cloud/
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: distribution
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: distribution
          path: dist/

      - name: Create GitHub Release with auto-generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Release ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            dist/*
