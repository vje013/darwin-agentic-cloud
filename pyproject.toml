[project]
name = "darwin-agentic-cloud"
version = "2.0.0"
description = "Darwin — adaptive software systems. Includes darwin.agenticcloud, the verifiable agentic cloud. Open-source compute for AI agents with cryptographically signed attestations."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Vladimir J Edouard", email = "135543245+vje013@users.noreply.github.com" },
]
keywords = [
    "agents",
    "ai",
    "compute",
    "attestation",
    "sandbox",
    "mcp",
    "verifiable-execution",
    "agentic-cloud",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Topic :: Security :: Cryptography",
]

dependencies = [
    # Core
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "cryptography>=44,<50",

    # HTTP server
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "httpx>=0.27,<1",
    "slowapi>=0.1.9,<1",
    "aiobotocore>=2.15,<3",

    # CLI
    "typer>=0.13,<1",
    "rich>=13.9,<16",

    # Sandbox
    "docker>=7.1,<8",

    # MCP
    "mcp>=1.0,<2",

    # Storage
    "sqlalchemy>=2.0,<3",
    "aiosqlite>=0.20,<1",

    # Observability
    "structlog>=24.4,<27",
    "opentelemetry-api>=1.28,<2",
    "opentelemetry-sdk>=1.28,<2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7,<1",
    "mypy>=1.13,<3",
    "types-requests",
    "pre-commit>=4.0,<5",
]
test = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=6,<8",
    "pytest-timeout>=2.3,<3",
    "httpx>=0.27,<1",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
]
all = ["darwin-agentic-cloud[dev,test]"]

[project.scripts]
darwin = "darwin.agenticcloud.cli:app"

[project.urls]
Homepage = "https://github.com/vje013/darwin-agentic-cloud"
Repository = "https://github.com/vje013/darwin-agentic-cloud"
Issues = "https://github.com/vje013/darwin-agentic-cloud/issues"
Changelog = "https://github.com/vje013/darwin-agentic-cloud/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["darwin"]

[tool.setuptools.packages.find]
where = ["."]
include = ["darwin*"]
exclude = ["tests*", "docs*"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.venv*",
    "/.git",
    "/.github",
    "/.idea",
    "/.vscode",
    "/dist",
    "/build",
    "/__pycache__",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.mypy_cache",
    "/htmlcov",
    "/.coverage",
    "/coverage.xml",
    "/*.broken*",
]

# -------------------------------------------------------------------
# Ruff configuration
# -------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "B",      # flake8-bugbear (real bug risks)
    "UP",     # pyupgrade (modernize syntax)
    "SIM",    # flake8-simplify
    "C4",     # flake8-comprehensions
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (formatter handles this)
    "B008",   # function call in default arg (FastAPI/Typer pattern)
    "SIM108", # use ternary (sometimes if/else is clearer)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "SIM117"]
"examples/**" = ["S101", "T201"]


[tool.ruff.lint.isort]
known-first-party = ["darwin"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# -------------------------------------------------------------------
# Mypy configuration
# -------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["docker.*", "mcp.*"]
ignore_missing_imports = true

# -------------------------------------------------------------------
# Pytest configuration
# -------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests requiring Docker",
    "unit: marks tests as fast unit tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["darwin"]
branch = true
omit = ["tests/*", "examples/*", "*/substrate/*", "*/p2p/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
