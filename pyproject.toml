[project]
name = "dac"
version = "0.1.0"
description = "Darwinic Agentic Cloud — the verifiable agentic cloud. Open-source compute for AI agents with cryptographically signed attestations."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Vladimir J Edouard", email = "135543245+vje013@users.noreply.github.com" },
]
keywords = [
    "agents",
    "ai",
    "compute",
    "attestation",
    "sandbox",
    "mcp",
    "verifiable-execution",
    "agentic-cloud",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Topic :: Security :: Cryptography",
]

dependencies = [
    # Core
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "cryptography>=42.0,<46",

    # HTTP server
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "httpx>=0.27,<1",

    # CLI
    "typer>=0.12,<1",
    "rich>=13.7,<15",

    # Sandbox
    "docker>=7.0,<8",

    # MCP
    "mcp>=1.0,<2",

    # Storage
    "sqlalchemy>=2.0,<3",
    "aiosqlite>=0.22.1,<1",

    # Observability
    "structlog>=24.1,<26",
    "opentelemetry-api>=1.24,<2",
    "opentelemetry-sdk>=1.24,<2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
    "types-requests",
    "pre-commit>=3.7,<5",
]
test = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<7",
    "pytest-timeout>=2.3,<3",
    "httpx>=0.27,<1",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
]
all = ["dac[dev,test,docs]"]

[project.scripts]
dac = "dac.cli:app"

[project.urls]
Homepage = "https://github.com/vje013/darwin-agentic-cloud"
Repository = "https://github.com/vje013/darwin-agentic-cloud"
Issues = "https://github.com/vje013/darwin-agentic-cloud/issues"
Changelog = "https://github.com/vje013/darwin-agentic-cloud/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dac"]

# -------------------------------------------------------------------
# Ruff configuration
# -------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit (security)
    "RUF", # ruff-specific
    "PL",  # pylint
    "PT",  # flake8-pytest-style
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]
ignore = [
    "E501",   # line too long (formatter handles)
    "PLR0913", # too many arguments
    "PLR2004", # magic value comparison
    "S101",   # use of assert (fine in tests)
    "S603",   # subprocess call (we use it intentionally)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]
"examples/**" = ["S101", "T201"]

[tool.ruff.lint.isort]
known-first-party = ["dac"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# -------------------------------------------------------------------
# Mypy configuration
# -------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["docker.*", "mcp.*"]
ignore_missing_imports = true

# -------------------------------------------------------------------
# Pytest configuration
# -------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests requiring Docker",
    "unit: marks tests as fast unit tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["dac"]
branch = true
omit = ["tests/*", "examples/*", "*/substrate/*", "*/p2p/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
